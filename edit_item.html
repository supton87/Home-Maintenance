{% extends "base.html" %}
{% block title %}Edit Item – {{ item.title }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li class="breadcrumb-item"><a href="{{ url_for('admin_items', house_id=house.id) }}">{{ house.name }}</a></li>
    <li class="breadcrumb-item active">Edit item</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header bg-white"><strong>Edit Checklist Item</strong></div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ item.title }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="2">{{ item.description or '' }}</textarea>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="form-label">Category</label>
              <input type="text" name="category" class="form-control" value="{{ item.category }}">
            </div>
            <div class="col">
              <label class="form-label">Priority</label>
              <select name="priority" class="form-select">
                <option value="low" {% if item.priority == 'low' %}selected{% endif %}>Low</option>
                <option value="medium" {% if item.priority == 'medium' %}selected{% endif %}>Medium</option>
                <option value="high" {% if item.priority == 'high' %}selected{% endif %}>High</option>
              </select>
            </div>
            <div class="col">
              <label class="form-label">Status</label>
              <select name="status" class="form-select">
                <option value="pending" {% if item.status == 'pending' %}selected{% endif %}>Pending</option>
                <option value="in_progress" {% if item.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                <option value="completed" {% if item.status == 'completed' %}selected{% endif %}>Completed</option>
                <option value="overdue" {% if item.status == 'overdue' %}selected{% endif %}>Overdue</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Due date</label>
            <input type="date" name="due_date" class="form-control"
                   value="{{ item.due_date.strftime('%Y-%m-%d') if item.due_date else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Notes / message</label>
            <textarea name="notes" class="form-control" rows="3">{{ item.notes or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('admin_items', house_id=house.id) }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
